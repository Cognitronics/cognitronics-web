services:
  cognitronics-web:
    image: nginx:alpine
    container_name: cognitronics-web
    restart: unless-stopped
    volumes:
      # only the public files – keeps .git, README etc. off the web
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./img:/usr/share/nginx/html/img:ro
    networks:
      - npm

networks:
  npm:
    external: true
    # Name of the network Nginx Proxy Manager runs in (docker network ls)
    name: nginx-proxy_default
